name: Deploy

# Lean CD: when the app code or data changes on main, sync the whole app to the
# server over SSH (dedicated key) and restart the single systemd service.
# Also callable from other workflows (e.g. the weekly relationType rebuild).
on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'wsgi.py'
      - 'requirements.txt'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: deploy-integrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync app
        # Sync the whole app (wsgi.py + services/ package) to /opt/integrations.
        # --delete removes files no longer in git; excluded paths (incl. the
        # server-only .env) are never deleted. deploy/ and docs are not needed at runtime.
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes" \
            --exclude='.git' --exclude='.github' --exclude='deploy' \
            --exclude='__pycache__' --exclude='*.pyc' \
            --exclude='.venv' --exclude='venv' --exclude='.env' \
            ./ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/integrations/"

      - name: Restart service
        # Requires a narrow passwordless sudoers grant on the server
        # (see deploy/DEPLOY.md). The service itself runs as www-data.
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo systemctl restart integrations"
