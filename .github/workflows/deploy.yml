name: Deploy policy-search

# Lean CD: when the policy-search code or data changes on main, sync the
# files to the server over SSH (dedicated key) and restart the service.
on:
  push:
    branches: [main]
    paths:
      - 'services/policy-search/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: deploy-policy-search
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync files
        # --delete removes files on the server that no longer exist in git.
        # The server-only .env is excluded, so --delete never touches it.
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes" \
            --exclude='__pycache__' --exclude='.env' \
            services/policy-search/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/integrations/services/policy-search/"

      - name: Restart service
        # Requires a narrow passwordless sudoers grant on the server
        # (see deploy/DEPLOY.md). The service itself keeps running as www-data.
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo systemctl restart policy-search"
